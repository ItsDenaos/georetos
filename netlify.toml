# Configuración de Netlify para GeoRetos (sitio estático generado por Vite).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Es una SPA: cualquier ruta (/mapa, /trivia, /silueta/diario…) sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los archivos de /assets llevan un hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
